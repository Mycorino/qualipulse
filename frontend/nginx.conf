# Local docker-compose only (production uses nginx.conf.template with envsubst)
# ── Interview-link previews ────────────────────────────────────────────────
# Interview links are shared with participants, so they must not unfurl with
# the marketing card baked into index.html (that copy sells the product to a
# researcher). Link unfurlers are routed to the backend, which renders a
# participant-facing card in the study's own language; every real visitor
# keeps getting the untouched SPA. See services/interview_preview.py.
map $http_user_agent $qp_unfurler {
    default 0;
    "~*(facebookexternalhit|Facebot|Twitterbot|Slackbot|Slack-ImgProxy|WhatsApp|Discordbot|TelegramBot|LinkedInBot|Applebot|SkypeUriPreview|redditbot|Pinterest|Iframely|embedly|vkShare|Viber|Snapchat|Mastodon|Bluesky|Googlebot|Google-InspectionTool|bingbot|DuckDuckBot|YandexBot|Slurp|W3C_Validator)" 1;
}
# ?app=1 opts out: it is the link the preview page itself offers, so a real
# person misdetected as a crawler still reaches the interview (no loop).
map $arg_app $qp_app_param {
    default 0;
    "1" 1;
}
map "$qp_unfurler$qp_app_param" $qp_serve_preview {
    default 0;
    "10" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Prerendered marketing home; index.html stays the empty SPA shell
    # (mirrors nginx.conf.template)
    location = / {
        try_files /home.html /index.html;
    }

    # Mirrors nginx.conf.template: serve prerendered $uri/index.html without
    # a trailing-slash redirect, and never emit absolute redirects (they
    # would leak the internal port).
    absolute_redirect off;

    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # sitemap.xml generated by the backend (mirrors nginx.conf.template)
    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Blog: server-rendered by the backend (mirrors nginx.conf.template)
    location = /blog {
        rewrite ^ /blog/pages break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location ~ ^/blog/[A-Za-z0-9-]+$ {
        rewrite ^/blog/(.*)$ /blog/pages/$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Interview links: /i/{token} and /interview/{token}. Unfurlers get the
    # server-rendered preview, everyone else gets the SPA shell.
    location ~ ^/(?:i|interview)/(?<qp_token>[A-Za-z0-9_-]+)$ {
        error_page 418 = @interview_preview;
        if ($qp_serve_preview) {
            return 418;
        }
        try_files /index.html =404;
    }
    location @interview_preview {
        rewrite ^ /interview/$qp_token/preview break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 55m;
    }

    location /audio/ {
        proxy_pass http://backend:8000/audio/;
        proxy_set_header Host $host;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    # Mirrors the production CSP in nginx.conf.template so local compose
    # catches CSP violations before they ship.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MguIPR6qNR8D3B+eAlK+bIRTZe8t3wkOY4B/56Me9FU=' https://js.stripe.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.stripe.com https://maps.googleapis.com https://*.sentry.io https://cloudflareinsights.com; frame-src 'self' blob: https://js.stripe.com https://hooks.stripe.com; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(self)";
}
