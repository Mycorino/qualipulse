name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: ci-test-secret-key-32-chars-min
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # Guards the failure mode that has broken four production deploys:
      # two PRs open at once each add a migration off the same parent, each
      # sees a single head on its own branch, and main ends up with two.
      # `alembic upgrade head` then refuses to run, start.sh falls back to
      # create_all(), and the container exits 255 without listening.
      #
      # This catches it because actions/checkout on a pull_request event
      # checks out the MERGE commit, so `alembic heads` sees what main will
      # look like after the merge, not what the branch looks like before it.
      - name: Single alembic head
        run: |
          heads=$(PYTHONPATH=. alembic heads | grep -c '(head)' || true)
          if [ "$heads" -ne 1 ]; then
            echo "Expected exactly 1 alembic head, found $heads:"
            PYTHONPATH=. alembic heads
            echo "::error::Multiple alembic heads. Add a merge revision (see 0063/0065/0067) before merging."
            exit 1
          fi

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: i18n parity check
        run: node scripts/check-i18n.mjs

      - name: Build
        run: npm run build

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t auto-interview-backend ./backend

      - name: Build frontend image
        run: docker build -t auto-interview-frontend ./frontend
